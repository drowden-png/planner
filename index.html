<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Sora:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F3EE;
    --bg-panel: #FFFFFF;
    --bg-sunken: #ECE8DE;
    --text: #1E1C18;
    --text-dim: #6F6A5E;
    --accent: #3E6B4F;
    --accent-2: #C77B3B;
    --line: #DAD4C4;
    --done: #3E6B4F;
    --late: #C77B3B;
    --missed: #B5473A;
    --radius: 10px;
    --font-head: 'Sora', sans-serif;
    --font-body: 'Sora', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --shadow: 0 1px 0 rgba(0,0,0,0.04);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }

  [data-theme="blockcraft"] {
    --bg: #1c2b1a;
    --bg-panel: #2b3f26;
    --bg-sunken: #223420;
    --text: #eae3c8;
    --text-dim: #a7ad8a;
    --accent: #6cbf3f;
    --accent-2: #a9682d;
    --line: #47593c;
    --done: #6cbf3f;
    --late: #d3a13a;
    --missed: #c1503a;
    --radius: 0px;
    --font-head: 'Press Start 2P', monospace;
    --font-body: 'Space Mono', monospace;
    --shadow: 4px 4px 0 rgba(0,0,0,0.35);
  }

  [data-theme="battleroyale"] {
    --bg: #0c0e1a;
    --bg-panel: #161a2e;
    --bg-sunken: #10132294;
    --text: #eef1ff;
    --text-dim: #8b91bd;
    --accent: #7c5cff;
    --accent-2: #16c2c2;
    --line: #2c3157;
    --done: #16c2c2;
    --late: #f2b33d;
    --missed: #ff5470;
    --radius: 4px;
    --font-head: 'Sora', sans-serif;
    --font-body: 'Sora', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --shadow: 0 0 24px rgba(124,92,255,0.25);
  }

  [data-theme="retroarcade"] {
    --bg: #1a0f2e;
    --bg-panel: #2a1a4a;
    --bg-sunken: #21123b;
    --text: #ffe9fb;
    --text-dim: #b394d6;
    --accent: #ff4fd8;
    --accent-2: #4fe0ff;
    --line: #4a2e78;
    --done: #4fe0ff;
    --late: #ffd24f;
    --missed: #ff4f6d;
    --radius: 2px;
    --font-head: 'Press Start 2P', monospace;
    --font-body: 'Space Mono', monospace;
    --shadow: 0 0 0 2px var(--accent);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #161510; --bg-panel: #201f19; --bg-sunken: #1b1a15;
      --text: #EDE9DD; --text-dim: #9a947f; --line: #34321f;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100%;
    transition: background .25s ease, color .25s ease;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--font-head); margin: 0; }
  button { font-family: inherit; cursor: pointer; }

  .app {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 20px; letter-spacing: .01em; }
  .brand span { color: var(--text-dim); font-size: 13px; font-family: var(--font-mono); }

  .stats {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .stat {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 14px;
    text-align: center;
    box-shadow: var(--shadow);
    min-width: 74px;
  }
  .stat .n { font-family: var(--font-mono); font-weight: 700; font-size: 18px; color: var(--accent); }
  .stat .l { font-size: 10px; color: var(--text-dim); text-transform: lowercase; margin-top: 2px; }

  .level-bar-wrap { margin-bottom: 22px; }
  .level-bar-top { display:flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom:6px; font-family: var(--font-mono); }
  .level-bar {
    height: 10px;
    background: var(--bg-sunken);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .level-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .4s ease;
  }

  /* ---------- Layout ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
  }

  /* ---------- Calendar ---------- */
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-head h2 { font-size: 15px; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button {
    background: var(--bg-sunken);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: var(--radius);
    width: 30px; height: 30px;
    font-size: 14px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .cal-dow {
    font-size: 11px;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-mono);
    padding-bottom: 8px;
    font-weight: 700;
  }
  .cal-day {
    position: relative;
    min-height: 100px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg-sunken);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 8px;
    cursor: pointer;
    transition: all .2s ease;
  }
  .cal-day:hover { border-color: var(--accent); background: var(--bg-panel); }
  .cal-day.empty { background: transparent; border-color: transparent; cursor: default; }
  .cal-day.today { border: 2px solid var(--accent); }
  .cal-day.selected { background: var(--accent); color: #fff; }
  .cal-day .day-num {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .cal-day.selected .day-num { color: #fff; }
  .cal-day .tasks-preview {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    width: 100%;
    font-size: 10px;
    overflow: hidden;
  }
  .cal-day .task-dot {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 2px 4px;
    border-radius: 2px;
    background: rgba(0,0,0,0.05);
  }
  .cal-day.selected .task-dot { background: rgba(255,255,255,0.2); }
  .cal-day .task-dot.done { color: var(--done); }
  .cal-day .task-dot.late { color: var(--late); }
  .cal-day .task-dot.pending { color: var(--text-dim); }
  .task-dot-indicator {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .task-dot.done .task-dot-indicator { background: var(--done); }
  .task-dot.late .task-dot-indicator { background: var(--late); }
  .task-dot.pending .task-dot-indicator { background: var(--accent-2); }

  /* ---------- Tasks ---------- */
  .task-head { display:flex; justify-content: space-between; align-items:center; margin-bottom: 12px; }
  .task-head h2 { font-size: 15px; }
  .task-head .sub { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }

  .task-form {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .task-form input {
    background: var(--bg-sunken);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: var(--radius);
    padding: 8px 10px;
    font-family: var(--font-body);
    font-size: 13px;
  }
  .task-form input[type="text"] { flex: 1 1 140px; }
  .task-form input[type="time"] { flex: 0 0 100px; }
  .task-form button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
  }

  .task-list { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; }
  .task {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-sunken);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
  }
  .task .box {
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 2px solid var(--accent);
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    background: transparent;
    color: transparent;
  }
  .task.done .box { background: var(--done); border-color: var(--done); color: #fff; }
  .task.missed .box { border-color: var(--missed); }
  .task .info { flex: 1; min-width: 0; }
  .task .title { font-size: 13.5px; }
  .task.done .title { text-decoration: line-through; color: var(--text-dim); }
  .task .meta { margin-top: 4px; }
  .task .due-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: var(--radius);
    background: var(--bg-panel);
    border: 1px solid var(--accent-2);
    color: var(--accent-2);
  }
  .task.missed .due-badge { border-color: var(--missed); color: var(--missed); }
  .task.done .due-badge { border-color: var(--done); color: var(--done); opacity: .8; }
  .task .due-badge.no-time { border-color: var(--line); color: var(--text-dim); }
  .task .pts { font-family: var(--font-mono); font-size: 11px; font-weight: 700; }
  .task .pts.on { color: var(--done); }
  .task .pts.late { color: var(--late); }
  .task .del {
    background: transparent; border: none; color: var(--text-dim);
    font-size: 15px; padding: 2px 4px; line-height: 1;
  }
  .empty-state { color: var(--text-dim); font-size: 13px; padding: 20px 4px; text-align: center; }

  /* ---------- Themes ---------- */
  .themes-panel { margin-top: 20px; }
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .theme-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    background: var(--bg-sunken);
    position: relative;
    overflow: hidden;
  }
  .theme-card .swatches { display: flex; gap: 4px; margin-bottom: 8px; }
  .theme-card .sw { width: 16px; height: 16px; border-radius: 4px; }
  .theme-card .name { font-size: 12.5px; font-weight: 700; margin-bottom: 2px; }
  .theme-card .desc { font-size: 10.5px; color: var(--text-dim); margin-bottom: 8px; line-height: 1.4; }
  .theme-card button {
    width: 100%;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    border-radius: var(--radius);
    padding: 6px;
    font-size: 11px;
    font-weight: 700;
  }
  .theme-card button.active { background: var(--accent); color: #fff; }
  .theme-card button:disabled { opacity: .55; border-color: var(--text-dim); color: var(--text-dim); cursor: not-allowed; }
  .theme-card.locked::after {
    content: "🔒";
    position: absolute;
    top: 10px; right: 10px;
    font-size: 13px;
    opacity: .6;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <h1>Quest Planner</h1>
      <span id="today-label"></span>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="stat-points">0</div><div class="l">points</div></div>
      <div class="stat"><div class="n" id="stat-level">1</div><div class="l">level</div></div>
      <div class="stat"><div class="n" id="stat-streak">0</div><div class="l">streak</div></div>
    </div>
  </div>

  <div class="level-bar-wrap">
    <div class="level-bar-top"><span id="level-label">Level 1</span><span id="level-progress-label">0 / 100</span></div>
    <div class="level-bar"><div class="level-bar-fill" id="level-fill" style="width:0%"></div></div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="cal-head">
        <h2 id="cal-title">Month</h2>
        <div class="cal-nav">
          <button id="cal-prev">‹</button>
          <button id="cal-today">•</button>
          <button id="cal-next">›</button>
        </div>
      </div>
      <div class="cal-grid" id="cal-dow-row"></div>
      <div class="cal-grid" id="cal-grid" style="margin-top:0;"></div>
    </div>

    <div class="panel">
      <div class="task-head">
        <h2 id="task-date-title">Today</h2>
        <span class="sub" id="task-date-sub"></span>
      </div>
      <form class="task-form" id="task-form">
        <input type="text" id="task-title" placeholder="New quest…" required>
        <input type="time" id="task-time">
        <button type="submit">Add</button>
      </form>
      <div class="task-list" id="task-list"></div>
    </div>
  </div>

  <div class="panel themes-panel">
    <h2 style="font-size:15px;">Themes</h2>
    <div class="theme-grid" id="theme-grid"></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------- Data ----------
  const THEMES = [
    { id: "default", name: "Classic", desc: "Clean everyday planner.", unlockAt: 0,
      swatches: ["#3E6B4F","#C77B3B","#F5F3EE"] },
    { id: "blockcraft", name: "Blockcraft", desc: "Blocky pixel-world theme for builders.", unlockAt: 50,
      swatches: ["#6cbf3f","#a9682d","#1c2b1a"] },
    { id: "battleroyale", name: "Battle Royale", desc: "Neon storm-circle vibes for squads.", unlockAt: 150,
      swatches: ["#7c5cff","#16c2c2","#0c0e1a"] },
    { id: "retroarcade", name: "Retro Arcade", desc: "8-bit cabinet glow, high score energy.", unlockAt: 300,
      swatches: ["#ff4fd8","#4fe0ff","#1a0f2e"] },
  ];

  const ON_TIME_POINTS = 10;
  const LATE_POINTS = 3;
  const POINTS_PER_LEVEL = 100;
  const STORE_KEY = "quest-planner-v1";

  function todayStr(d){
    const dt = d || new Date();
    return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
  }

  function loadState(){
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return { tasks: [], points: 0, unlocked: ["default"], theme: "default" };
  }
  function saveState(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  let state = loadState();
  let viewYear, viewMonth;
  {
    const n = new Date();
    viewYear = n.getFullYear();
    viewMonth = n.getMonth();
  }
  let selectedDate = todayStr();

  // ---------- Points / leveling ----------
  function recomputePoints(){
    let pts = 0;
    for (const t of state.tasks){
      if (t.done) pts += t.late ? LATE_POINTS : ON_TIME_POINTS;
    }
    state.points = pts;
  }

  function currentLevel(){
    return Math.floor(state.points / POINTS_PER_LEVEL) + 1;
  }

  function currentStreak(){
    const byDate = {};
    for (const t of state.tasks){
      (byDate[t.date] = byDate[t.date] || []).push(t);
    }
    let streak = 0;
    let d = new Date();
    for (let i = 0; i < 366; i++){
      const ds = todayStr(d);
      const dayTasks = byDate[ds];
      if (!dayTasks || dayTasks.length === 0){
        d.setDate(d.getDate() - 1);
        if (ds === todayStr()) continue;
        break;
      }
      const allOnTime = dayTasks.every(t => t.done && !t.late);
      if (!allOnTime) break;
      streak++;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  function unlockCheck(){
    let changed = false;
    for (const th of THEMES){
      if (state.points >= th.unlockAt && !state.unlocked.includes(th.id)){
        state.unlocked.push(th.id);
        changed = true;
      }
    }
    return changed;
  }

  // ---------- Rendering ----------
  const $ = (sel) => document.querySelector(sel);

  function applyTheme(){
    if (state.theme === "default"){
      document.body.removeAttribute("data-theme");
    } else {
      document.body.setAttribute("data-theme", state.theme);
    }
  }

  function renderStats(){
    recomputePoints();
    const newlyUnlocked = unlockCheck();
    const lvl = currentLevel();
    const intoLevel = state.points % POINTS_PER_LEVEL;
    $("#stat-points").textContent = state.points;
    $("#stat-level").textContent = lvl;
    $("#stat-streak").textContent = currentStreak();
    $("#level-label").textContent = "Level " + lvl;
    $("#level-progress-label").textContent = intoLevel + " / " + POINTS_PER_LEVEL;
    $("#level-fill").style.width = intoLevel + "%";
    if (newlyUnlocked) saveState();
    renderThemes();
  }

  function renderCalendar(){
    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    $("#cal-title").textContent = monthNames[viewMonth] + " " + viewYear;

    const dowRow = $("#cal-dow-row");
    dowRow.innerHTML = "";
    ["S","M","T","W","T","F","S"].forEach(d=>{
      const el = document.createElement("div");
      el.className = "cal-dow";
      el.textContent = d;
      dowRow.appendChild(el);
    });

    const grid = $("#cal-grid");
    grid.innerHTML = "";
    const firstDow = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const today = todayStr();

    const tasksByDate = {};
    for (const t of state.tasks){
      (tasksByDate[t.date] = tasksByDate[t.date] || []).push(t);
    }

    for (let i = 0; i < firstDow; i++){
      const el = document.createElement("div");
      el.className = "cal-day empty";
      grid.appendChild(el);
    }
    for (let day = 1; day <= daysInMonth; day++){
      const dateStr = viewYear + "-" + String(viewMonth+1).padStart(2,"0") + "-" + String(day).padStart(2,"0");
      const el = document.createElement("div");
      el.className = "cal-day";
      if (dateStr === today) el.classList.add("today");
      if (dateStr === selectedDate) el.classList.add("selected");

      const num = document.createElement("div");
      num.className = "day-num";
      num.textContent = day;
      el.appendChild(num);

      const dayTasks = tasksByDate[dateStr] || [];
      if (dayTasks.length){
        const preview = document.createElement("div");
        preview.className = "tasks-preview";
        dayTasks.slice(0,3).forEach(t=>{
          const dot = document.createElement("div");
          dot.className = "task-dot " + (t.done ? "done" : (isPastDue(t) && !t.done ? "late" : "pending"));
          const indicator = document.createElement("div");
          indicator.className = "task-dot-indicator";
          dot.appendChild(indicator);
          const label = document.createElement("span");
          label.textContent = t.title.substring(0, 12);
          if (t.title.length > 12) label.textContent += "…";
          dot.appendChild(label);
          preview.appendChild(dot);
        });
        if (dayTasks.length > 3){
          const more = document.createElement("div");
          more.className = "task-dot pending";
          more.textContent = "+" + (dayTasks.length - 3);
          more.style.fontSize = "9px";
          preview.appendChild(more);
        }
        el.appendChild(preview);
      }

      el.addEventListener("click", ()=>{
        selectedDate = dateStr;
        renderAll();
      });
      grid.appendChild(el);
    }
  }

  function fmtDateLong(dateStr){
    const [y,m,d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  }

  function fmtDateShort(dateStr){
    const [y,m,d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function fmtTime12(timeStr){
    const [h,m] = timeStr.split(":").map(Number);
    const period = h >= 12 ? "PM" : "AM";
    const h12 = ((h % 12) || 12);
    return h12 + ":" + String(m).padStart(2,"0") + " " + period;
  }

  function renderTasks(){
    $("#task-date-title").textContent = fmtDateLong(selectedDate);
    const isToday = selectedDate === todayStr();
    $("#task-date-sub").textContent = isToday ? "today" : "";

    const list = $("#task-list");
    list.innerHTML = "";
    const dayTasks = state.tasks
      .filter(t => t.date === selectedDate)
      .sort((a,b)=> (a.time||"99:99").localeCompare(b.time||"99:99"));

    if (!dayTasks.length){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No quests yet — add one above.";
      list.appendChild(empty);
      return;
    }

    for (const t of dayTasks){
      const row = document.createElement("div");
      row.className = "task" + (t.done ? " done" : "") + (isPastDue(t) && !t.done ? " missed" : "");

      const box = document.createElement("button");
      box.className = "box";
      box.type = "button";
      box.textContent = t.done ? "✓" : "";
      box.addEventListener("click", ()=> toggleTask(t.id));
      row.appendChild(box);

      const info = document.createElement("div");
      info.className = "info";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = t.title;
      info.appendChild(title);
      const meta = document.createElement("div");
      meta.className = "meta";
      const badge = document.createElement("span");
      badge.className = "due-badge" + (t.time ? "" : " no-time");
      badge.textContent = "📅 " + fmtDateShort(t.date) + (t.time ? " · " + fmtTime12(t.time) : " · no time set");
      meta.appendChild(badge);
      info.appendChild(meta);
      row.appendChild(info);

      if (t.done){
        const pts = document.createElement("div");
        pts.className = "pts " + (t.late ? "late" : "on");
        pts.textContent = (t.late ? "+" + LATE_POINTS : "+" + ON_TIME_POINTS);
        row.appendChild(pts);
      }

      const del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.textContent = "✕";
      del.addEventListener("click", ()=> deleteTask(t.id));
      row.appendChild(del);

      list.appendChild(row);
    }
  }

  function isPastDue(t){
    if (t.date !== todayStr() || !t.time) return t.date < todayStr();
    const now = new Date();
    const [h,m] = t.time.split(":").map(Number);
    const due = new Date();
    due.setHours(h,m,0,0);
    return now > due;
  }

  function renderThemes(){
    const grid = $("#theme-grid");
    grid.innerHTML = "";
    for (const th of THEMES){
      const unlocked = state.unlocked.includes(th.id);
      const card = document.createElement("div");
      card.className = "theme-card" + (unlocked ? "" : " locked");

      const sw = document.createElement("div");
      sw.className = "swatches";
      th.swatches.forEach(c=>{
        const s = document.createElement("div");
        s.className = "sw";
        s.style.background = c;
        sw.appendChild(s);
      });
      card.appendChild(sw);

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = th.name;
      card.appendChild(name);

      const desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = unlocked ? th.desc : (th.desc + " Unlocks at " + th.unlockAt + " pts.");
      card.appendChild(desc);

      const btn = document.createElement("button");
      btn.type = "button";
      if (!unlocked){
        btn.textContent = "Locked";
        btn.disabled = true;
      } else if (state.theme === th.id){
        btn.textContent = "Active";
        btn.className = "active";
        btn.disabled = true;
      } else {
        btn.textContent = "Use theme";
        btn.addEventListener("click", ()=>{
          state.theme = th.id;
          saveState();
          applyTheme();
          renderThemes();
        });
      }
      card.appendChild(btn);
      grid.appendChild(card);
    }
  }

  function renderAll(){
    renderStats();
    renderCalendar();
    renderTasks();
  }

  // ---------- Actions ----------
  function toggleTask(id){
    const t = state.tasks.find(x=>x.id===id);
    if (!t) return;
    if (t.done){
      t.done = false;
      t.late = false;
      t.completedAt = null;
    } else {
      t.done = true;
      t.late = isPastDue(t);
      t.completedAt = new Date().toISOString();
    }
    saveState();
    renderAll();
  }

  function deleteTask(id){
    state.tasks = state.tasks.filter(t=>t.id!==id);
    saveState();
    renderAll();
  }

  function addTask(title, time){
    state.tasks.push({
      id: "t" + Date.now() + Math.random().toString(36).slice(2,7),
      date: selectedDate,
      time: time || "",
      title: title,
      done: false,
      late: false,
      completedAt: null
    });
    saveState();
    renderAll();
  }

  // ---------- Wire up ----------
  $("#task-form").addEventListener("submit", (e)=>{
    e.preventDefault();
    const titleEl = $("#task-title");
    const timeEl = $("#task-time");
    const title = titleEl.value.trim();
    if (!title) return;
    addTask(title, timeEl.value);
    titleEl.value = "";
    timeEl.value = "";
    titleEl.focus();
  });

  $("#cal-prev").addEventListener("click", ()=>{
    viewMonth--;
    if (viewMonth < 0){ viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  $("#cal-next").addEventListener("click", ()=>{
    viewMonth++;
    if (viewMonth > 11){ viewMonth = 0; viewYear++; }
    renderCalendar();
  });
  $("#cal-today").addEventListener("click", ()=>{
    const n = new Date();
    viewYear = n.getFullYear();
    viewMonth = n.getMonth();
    selectedDate = todayStr();
    renderAll();
  });

  $("#today-label").textContent = new Date().toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });

  applyTheme();
  renderAll();
})();
</script>
</body>
</html>
